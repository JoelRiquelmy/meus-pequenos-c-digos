<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <titlet>Formulários</title>
</head>
<body>
    <h1>Formulários</h1>
    <form>
        <input type="text" placeholder="seu nome">
        <br>
        <label for="email">Seu e-mail</label>
        <input id="email">
        <br>
        <input type="tel" placeholder="Seu telefone">
        <br>
        <label for="number">Escolha um número</label>
        <input id="number" type="number" max="10" min="2" step="2" >
        <br>
        <input type="file">
        <br>
        <label for="cor">Escolha sua cor preferida</label>
        <input id="cor" type="color">
        <br>
        <input type="checkbox" id="checkbox-termos"> <label for="checkbox-termos">Aceito os termos</label>
        <br>
        <p>Qual sua arma de cs favorita?</p>
        <input type="radio" name="arma de cs favorita" id="ak-47"> <label for="ak-47">ak-47</label>
        <input type="radio" name="arma de cs favorita" id="m4a1-s"> <label for="m4a1-s">m4a1-s</label>
        <input type="radio" name="arma de cs favorita" id="mata-pombo"> <label for="mata-pombo">mata-pombo</label>
        <br>
        <label>Qual seu filme favorito?</label>
        <br>
        <select>
            <option value="">Enrolados</option>
            <option value="">The princess and frog</option>
            <option value="">Fallen insider - o sonho do major</option>
        </select>
        <br>
        <label >Fale do Fallen</label> 
        <br>
        <textarea></textarea>
        <button>enviar</button>
        <button>limpar</button>
    </form>
</body>
</html>
