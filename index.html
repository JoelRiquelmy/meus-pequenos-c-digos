<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de contatos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./adc.css">
</head>
<body>
    <div class="container">
        <header><h1>Agenda de contatos</h1></header>
    
    <form id="agenda">
        <input id="nome" type="text" placeholder="Nome" required>
        <input id="numero" type="tel" placeholder="(XX) XXXXX-XXXX" required>
        <button>Adicionar+</button>
    </form>
    <table id="agenda-table" cellspacing="0">
        
            <thead>
                <tr> 
                    <th>Nome usúario</th>
                    <th>Telefone usúario</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
            <tfoot>
                <td id="nome-usuario">---</td>
                <td id="numero-usuario">---</td>
            </tfoot>
        
    </table>
    </div>
    
    <script src="./adc.js"></script>
</body>
</html>
