<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <form action="">
            <label id="nome" class="form-label" for="nome">Seu nome:</label>
            <input id="nome" class="form-control"  type="text">
            <label id="email" class="form-label" for="email">Seu email:</label>
            <input id="email" class="form-control" type="email">
            <label id="telefone" class="form-label" for="telefone">Seu telefone:</label>
            <input id="telefone" class="form-control" type="tel">
            <label id="pergunta" for="textarea">Sua perunta:</label>
            <textarea class="form-control" name="Sua pergunta" id="pergunta"></textarea>
        </form>
    </div>
</body>
</html>
