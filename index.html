<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de médias</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./cdm.css">
</head>
<body>
    <div class="container">
        <header>
            <img src="./images/logo.png" alt="capleo e diploma">
            <h1>Calculadora de médias</h1>
        </header>
        <form id="form-atividade">
            <input  type="text" id="nome-atividade" required placeholder="Nome da atividade">
            <input  type="number" id="nota-atividade" required placeholder="Nota" min="0" max="10">
            <button style="background-color: rgb(18, 129, 18); color: #fff; border:none; cursor: pointer;" type="submit">Adicionar+</button>
        </form>
        <table cellspacing="0" >
            <thead>
                <tr>
                    <th>Nome da atividade</th>
                    <th>Nota</th>
                    <th>Aprovado?</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
            <tfoot>
                <td>Média final</td>
                <td id="media-final-valor">---</td>
                <td id="media-final-resultado"> <span class="resultado">---</span></td>
            </tfoot>
        </table>
    </div>
    <script src="./cdm.js"></script>
</body>
</html>
